<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta http-equiv="refresh" content="0; url=python_learning.html">
<link rel="canonical" href="python_learning.html">
<title>Python 학습 가이드</title>
<style>
  :root{ --bg:#f7f9f8; --card:#fff; --ink:#132320; --muted:#5f7370; --line:#dfe8e5; --accent:#0d8577; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1615; --card:#151f1e; --ink:#e6efec; --muted:#93a8a4; --line:#25322f; --accent:#38b8a4; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:'Pretendard Variable',Pretendard,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
       padding:24px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:38px 34px;
        max-width:440px;width:100%;text-align:center;box-shadow:0 6px 28px rgba(0,0,0,.06)}
  h1{font-size:21px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px}
  p{margin:0 0 22px;color:var(--muted);font-size:14.5px}
  a.go{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;
       font-size:14.5px;padding:11px 26px;border-radius:11px}
  a.go:hover{filter:brightness(1.08)}
  .spin{width:26px;height:26px;margin:0 auto 18px;border:3px solid var(--line);
        border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="spin"></div>
    <h1>🐍 Python 학습 가이드</h1>
    <p>학습 페이지로 이동 중입니다…</p>
    <a class="go" href="python_learning.html">바로 열기 →</a>
  </div>
<script>location.replace('python_learning.html');</script>
</body>
</html>
